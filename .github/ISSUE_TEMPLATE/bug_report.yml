name: Bug report
description: Something is wrong, from a wrong number to a crash.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste account numbers, amounts, holdings, tokens or other credentials here.** Turn on
        "hide amounts" before taking screenshots, and replace identifiers in logs or payloads with
        made-up ones. Security problems go through [SECURITY.md](../blob/master/SECURITY.md), not
        an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: broker
    attributes:
      label: Broker
      multiple: true
      options:
        - SaxoBank
        - Interactive Brokers
        - Not broker specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you run (`git rev-parse --short HEAD`).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node and PostgreSQL versions, and whether you run `dev.sh` or a production build.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Anonymized. Reconciliation issues are most useful with the issue kind and the dates.
      render: text
